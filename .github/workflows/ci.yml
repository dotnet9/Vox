# 质量 CI：构建 + 单元测试 + 原型门禁（此前只在打 tag 发布时跑流水线，质量检查缺位）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    name: 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 从固定源码还原自研候选包（Arc 仍使用官方 NuGet）
        shell: pwsh
        run: ./scripts/restore_library_candidate.ps1 -OutputRoot '${{ runner.temp }}/vox-library-candidate'
      - name: 构建 + 单元测试（build.ps1 -Test）
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: 安装器与发布清单回归
        shell: pwsh
        run: |
          python scripts/installer/embed_changelog.py
          ./scripts/tests/windows_setup_test.ps1 -WorkRoot '${{ runner.temp }}/vox-setup-contract'
          ./scripts/tests/release_assets_test.ps1 -WorkRoot '${{ runner.temp }}/vox-assets-contract'
  prototype-gate:
    name: 原型门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 原型校验（视图清单 / 资产存在性 / 离线自治）
        run: node design/scripts/check-prototype.cjs

  native-smoke:
    name: Windows NativeAOT 发布与运行
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 还原固定自研依赖
        shell: pwsh
        run: ./scripts/restore_library_candidate.ps1 -OutputRoot '${{ runner.temp }}/vox-library-candidate'
      - name: 发布正式 NativeAOT 程序
        shell: pwsh
        run: ./scripts/publish.ps1 -Rid win-x64
      - name: 验证原生窗口、页面、语言与可空设置
        shell: pwsh
        run: ./scripts/verify_native_publish.ps1 -Rid win-x64 -SourceDirectory './artifacts/publish/Vox.App-win-x64' -VerificationDirectory '${{ runner.temp }}/vox-native-verification'
      - name: 保存原生界面与运行证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vox-native-verification
          path: |
            ${{ runner.temp }}/vox-native-verification/*.txt
            ${{ runner.temp }}/vox-native-verification/*.png
          if-no-files-found: warn
