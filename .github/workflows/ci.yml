# 质量 CI：构建 + 单元测试 + 原型门禁（此前只在打 tag 发布时跑流水线，质量检查缺位）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    name: 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 从固定源码还原自研候选包（Arc 仍使用官方 NuGet）
        shell: pwsh
        run: ./scripts/restore_library_candidate.ps1 -OutputRoot '${{ runner.temp }}/vox-library-candidate'
      - name: 构建 + 单元测试（build.ps1 -Test）
        shell: pwsh
        run: ./scripts/build.ps1 -Test
  prototype-gate:
    name: 原型门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 原型校验（视图清单 / 资产存在性 / 离线自治）
        run: node design/scripts/check-prototype.cjs

  native-smoke:
    name: Windows NativeAOT 发布与运行
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 发布正式 NativeAOT 程序
        shell: pwsh
        run: ./scripts/publish-aot.ps1 -RID win-x64
      - name: 验证原生窗口、页面、语言与可空设置
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'vox-native-verification'
          $start = [Diagnostics.ProcessStartInfo]::new((Resolve-Path './publish/aot/win-x64/Vox.exe').Path)
          $start.UseShellExecute = $false
          $start.ArgumentList.Add('--verify-runtime')
          $start.ArgumentList.Add($directory)
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Native runtime verification timed out.' }
          if ($process.ExitCode -ne 0) { throw "Native runtime verification failed: $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $directory 'runtime-verification.txt') -Raw
          if ($result -notmatch '^NativeAOT runtime verification passed;') { throw 'Native runtime evidence is missing.' }
          Write-Output $result
      - name: 保存原生界面与运行证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vox-native-verification
          path: |
            ${{ runner.temp }}/vox-native-verification/*.txt
            ${{ runner.temp }}/vox-native-verification/*.png
          if-no-files-found: warn
