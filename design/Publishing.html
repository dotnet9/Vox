<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="indigo" data-density="normal">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>发布清单 · Vox 维声</title>
<link rel="icon" href="assets/vox-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/palettes.css"><link rel="stylesheet" href="assets/density.css"><link rel="stylesheet" href="assets/vox/app.css">
</head>
<body data-page="publishing">
<div class="app-window">
  <header class="titlebar" id="tb"></header>
  <div class="window-body">
    <aside class="nav" id="nav"></aside>
    <main class="main">
      <div class="crumb"><a href="Articles.html">文章管理</a><svg class="ico" style="width:12px;height:12px"><use href="#i-chevron"/></svg><b>发布清单</b></div>
      <div class="page-head">
        <div><h1 id="pf-title">—</h1><p id="pf-meta">—</p></div>
        <div class="page-actions"><button class="btn" type="button" id="float-open"><svg class="ico"><use href="#i-clipboard"/></svg>复制助手</button></div>
      </div>
      <section class="card">
        <div class="matrix-note"><svg class="ico" style="margin-top:2px"><use href="#i-info"/></svg>
          <span>接入方式：<span class="badge api">API 直发</span> 官方接口一键完成 · <span class="badge unofficial">非官方接口</span> cookie 失效自动降级复制 · <span class="badge copy">复制助手</span> 渲染打包后逐框粘贴 · <span class="badge git">git 镜像</span> 随仓库推送。状态写入本地 SQLite，源文件改动即标「需更新」。</span>
        </div>
        <table class="table">
          <thead><tr><th>平台</th><th>接入方式</th><th>状态</th><th>详情</th><th></th></tr></thead>
          <tbody id="platform-body"></tbody>
          <tfoot><tr><td colspan="5" style="padding:0"><div class="bulk-bar">
            <button class="btn primary" type="button"><svg class="ico"><use href="#i-send"/></svg>一键发布所有自动化平台（9）</button>
            <button class="btn" type="button"><svg class="ico"><use href="#i-clipboard"/></svg>依次打开未发布创作页（7）</button>
            <button class="btn" type="button"><svg class="ico"><use href="#i-git"/></svg>同步 git 镜像</button>
            <span class="hint">自动化通道预计 2 分钟 · 复制通道每平台约 15 秒</span>
          </div></td></tr></tfoot>
        </table>
      </section>
    </main>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<aside class="float-panel" id="float-panel" hidden aria-label="复制助手浮动面板">
  <div class="float-titlebar"><img src="assets/vox-logo.svg" alt=""><b>复制助手</b><span class="target">→ 知乎</span><button class="icon-btn" type="button" id="float-close" title="收起"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <div class="float-body" id="float-fields"></div>
  <div class="float-foot">
    <button class="btn" type="button" id="float-compose"><svg class="ico"><use href="#i-ext"/></svg>打开创作页</button>
    <button class="btn primary" type="button" id="float-done"><svg class="ico"><use href="#i-check"/></svg>标记完成</button>
  </div>
  <div class="float-hint">点字段或 <kbd>Alt</kbd>+<kbd>1-5</kbd> 复制；实机中「正文」为 CF_HTML 富文本，粘贴后平台自动转存外链图片。</div>
</aside>

<script src="assets/palettes.js"></script><script src="assets/palette-rules.js"></script><script src="assets/generated/palette-rules-data.js"></script><script src="assets/project-info.js"></script><script src="assets/vox/app.js"></script>
</body>
</html>
