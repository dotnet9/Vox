<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="indigo" data-density="normal">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>规范体检 · Vox 维声</title>
<link rel="icon" href="assets/vox-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/palettes.css"><link rel="stylesheet" href="assets/density.css"><link rel="stylesheet" href="assets/vox/app.css">
</head>
<body data-page="audit">
<div class="app-window">
  <header class="titlebar" id="tb"></header>
  <div class="window-body">
    <aside class="nav" id="nav"></aside>
    <main class="main">
      <div class="page-head">
        <div><h1>规范体检</h1><p>CONTENT_GUIDE 规则即检查器：发布级必填、slug 规则、封面与图片可达性</p></div>
        <div class="page-actions"><button class="btn" type="button"><svg class="ico"><use href="#i-refresh"/></svg>重新体检</button><button class="btn primary" type="button"><svg class="ico"><use href="#i-check"/></svg>批量修复建议项</button></div>
      </div>
      <div class="sev-row">
        <div class="sev"><span class="ico-box" style="background:var(--panel);color:var(--fg)"><svg class="ico"><use href="#i-file"/></svg></span><div><div class="num" id="audit-all">—</div><div class="lbl">全部待处理</div></div></div>
        <div class="sev"><span class="ico-box" style="background:var(--danger-soft);color:var(--danger)"><svg class="ico"><use href="#i-warn"/></svg></span><div><div class="num">3</div><div class="lbl">阻断（slug / 死链）</div></div></div>
        <div class="sev"><span class="ico-box" style="background:var(--warning-soft);color:var(--warning)"><svg class="ico"><use href="#i-image"/></svg></span><div><div class="num">5</div><div class="lbl">警告（封面 / 摘要）</div></div></div>
        <div class="sev"><span class="ico-box" style="background:var(--info-soft);color:var(--info)"><svg class="ico"><use href="#i-info"/></svg></span><div><div class="num">5</div><div class="lbl">建议（lastmod / draft）</div></div></div>
      </div>
      <div id="audit-groups"></div>
    </main>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<script src="assets/palettes.js"></script><script src="assets/palette-rules.js"></script><script src="assets/generated/palette-rules-data.js"></script><script src="assets/project-info.js"></script><script src="assets/vox/app.js"></script>
</body>
</html>
