<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="indigo" data-density="normal">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>概览 · Vox 维声</title>
<link rel="icon" href="assets/vox-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/palettes.css"><link rel="stylesheet" href="assets/density.css"><link rel="stylesheet" href="assets/vox/app.css">
</head>
<body data-page="dashboard">
<div class="app-window">
  <header class="titlebar" id="tb"></header>
  <div class="window-body">
    <aside class="nav" id="nav"></aside>
    <main class="main">
      <div class="page-head">
        <div><h1>仓库概览</h1><p>Assets.Dotnet9 · 内容事实源 · YYYY/MM/slug.md + slug.yml</p></div>
        <div class="page-actions"><button class="btn" type="button" onclick="void 0"><svg class="ico"><use href="#i-refresh"/></svg>重新扫描</button><a class="btn primary" href="Publishing.html"><svg class="ico"><use href="#i-publish"/></svg>发布清单</a></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="num">550</div><div class="lbl">文章总数</div></div>
        <div class="stat"><div class="num">5,383</div><div class="lbl">图片资源</div></div>
        <div class="stat"><div class="num">128.4 万</div><div class="lbl">累计字数</div></div>
        <div class="stat"><div class="num">6</div><div class="lbl">本月新增</div></div>
      </div>
      <div class="grid" style="grid-template-columns:5fr 4fr;margin-bottom:14px">
        <section class="card">
          <div class="card-head"><h2>年度分布</h2><span class="badge">2019 – 2026</span></div>
          <div class="card-body"><div class="bars" id="year-bars"></div></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>分类 Top 6</h2><a href="Articles.html">全部 →</a></div>
          <div class="card-body"><div class="bars" id="cat-bars"></div></div>
        </section>
      </div>
      <div class="grid" style="grid-template-columns:4fr 5fr 4fr">
        <section class="card">
          <div class="card-head"><h2>专题进度</h2><span class="badge">albums</span></div>
          <div class="card-body" id="albums" style="padding-top:6px;padding-bottom:6px"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>最近文章</h2><a href="Articles.html">管理 →</a></div>
          <table class="table"><thead><tr><th>标题</th><th>日期</th><th>分类</th><th class="num">字数</th><th>状态</th><th></th></tr></thead><tbody id="recent-body"></tbody></table>
        </section>
        <section class="card">
          <div class="card-head"><h2>规范体检</h2><a href="Audit.html">全部 <span id="audit-total">—</span> 项 →</a></div>
          <div id="audit-summary-body"></div>
        </section>
      </div>
    </main>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<script src="assets/palettes.js"></script><script src="assets/palette-rules.js"></script><script src="assets/generated/palette-rules-data.js"></script><script src="assets/project-info.js"></script><script src="assets/vox/app.js"></script>
</body>
</html>
